name: test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Setup
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Build example
        run: npm run build:example
